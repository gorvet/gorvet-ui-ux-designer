name: Publish plugin release

on:
  push:
    branches: [main]
    paths: [plugin.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/validate_skills.py
      - run: python -m unittest discover -s tests -v
      - name: Build and verify package
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: python scripts/release_package.py build --output "$RUNNER_TEMP/gorvet-release" --commit "$RELEASE_COMMIT"
      - name: Publish complete stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gorvet-release"
          version=$(python -c 'import json; print(json.load(open("latest.json"))["version"])')
          tag="v$version"
          if gh release view "$tag" --json isDraft --jq .isDraft > is-draft.txt; then
            actual=$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq .target_commitish)
            test "$actual" = "$RELEASE_COMMIT" || { echo "Version already belongs to another commit; bump plugin.json"; exit 1; }
            if [ "$(cat is-draft.txt)" = "false" ]; then
              mkdir existing
              gh release download "$tag" --dir existing --pattern 'latest.json' --pattern '*.zip' --pattern 'SHA256SUMS'
              cmp latest.json existing/latest.json
              cmp "gorvet-ui-ux-designer-$version.zip" "existing/gorvet-ui-ux-designer-$version.zip"
              cmp SHA256SUMS existing/SHA256SUMS
              echo 'Identical release already published; no changes.'
              exit 0
            fi
            gh release upload "$tag" "gorvet-ui-ux-designer-$version.zip" latest.json SHA256SUMS --clobber
          else
            gh release create "$tag" "gorvet-ui-ux-designer-$version.zip" latest.json SHA256SUMS --target "$RELEASE_COMMIT" --title "GORVET UI/UX Designer $version" --notes-file RELEASE_NOTES.md --draft
          fi
          gh release edit "$tag" --draft=false --latest
